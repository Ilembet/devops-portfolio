name: notes-api

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  notes-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/notes-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/notes-api/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Unit tests
        run: python -m pytest
      - name: Validate compose file
        run: docker compose --env-file .env.example config --quiet
      - name: Smoke test (build, start, check /health)
        run: |
          cp .env.example .env
          docker compose up -d --build --wait
          curl --fail --silent http://localhost:8000/health
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Clean up
        if: always()
        run: docker compose down -v

  publish:
    # Only after tests pass, and only for commits that landed in main
    needs: notes-api
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ilembet/notes-api
          tags: |
            type=sha,format=short
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: projects/notes-api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
