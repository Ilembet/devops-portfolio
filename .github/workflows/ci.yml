name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: yamllint
        run: pipx install yamllint && yamllint .
      - name: shellcheck
        run: |
          mapfile -t files < <(git ls-files '*.sh')
          if [ "${#files[@]}" -gt 0 ]; then
            shellcheck "${files[@]}"
          else
            echo "No shell scripts yet"
          fi
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "**/*.md"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Look for Terraform files
        id: tf
        run: |
          if [ -n "$(git ls-files 'infra/*.tf' 'infra/**/*.tf')" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: hashicorp/setup-terraform@v3
        if: steps.tf.outputs.found == 'true'
      - name: fmt and validate
        if: steps.tf.outputs.found == 'true'
        run: |
          terraform fmt -check -recursive infra
          git ls-files 'infra/*.tf' 'infra/**/*.tf' | xargs -n1 dirname | sort -u | while read -r dir; do
            terraform -chdir="$dir" init -backend=false
            terraform -chdir="$dir" validate
          done
